name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: financebot
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: senha_de_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d financebot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_DB: financebot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: senha_de_ci
      DB_HOST: localhost
      DB_PORT: 5432
      TELEGRAM_BOT_TOKEN: token-falso-para-ci

    defaults:
      run:
        working-directory: finance-chat-bot

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar o Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: finance-chat-bot/pom.xml

      - name: Dar permissão ao Maven Wrapper
        run: chmod +x mvnw

      - name: Build e testes
        run: ./mvnw -B verify